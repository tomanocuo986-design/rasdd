name: ci
on:
  push:
  pull_request:

# أقل صلاحيات ممكنة للـ GITHUB_TOKEN (الفحوص لا تكتب في المستودع)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # كل خطوة حاجبة. لا continue-on-error.
      - name: package.json scripts point at real files
        run: npm run check:package
      - name: lint (strict set — الملفات المكتوبة بأنواع وقواعد كاملة)
        run: npm run lint:strict
      - name: typecheck
        run: npm run typecheck
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      - name: generated route tree must match committed file
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: offline package builds
        run: npm run build:offline

  # ثغرات معروفة في اعتماديات الإنتاج (التطبيق يقرأ ملفات يرفعها المستخدم)
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  # لا يُشغَّل إلا إن وُجد محرك Python في المشروع
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ hashFiles('python/**') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest python
